<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AetherSearch icon">
  <defs>
    <!-- Squircle mask -->
    <clipPath id="squircle">
      <path d="M64 0
               C 22 0, 0 22, 0 64
               S 22 128, 64 128
               106 128, 128 106
               128 64, 128 22
               106 0, 64 0 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161B"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8D8DD"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Body -->
    <rect width="128" height="128" fill="url(#bg)"/>
    <!-- Accent glow -->
    <ellipse cx="64" cy="36" rx="78" ry="60" fill="url(#glow)"/>
    <!-- Top inner highlight (Apple-style rim light) -->
    <rect x="0" y="0" width="128" height="48" fill="url(#rim)"/>

    <!-- Aether 'A' mark -->
    <g fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <!-- A stems -->
      <path d="M34 96 L64 32 L94 96"/>
      <!-- crossbar -->
      <path d="M46 76 H82"/>
    </g>

    <!-- Spark dot -->
    <circle cx="64" cy="22" r="4.2" fill="#0A84FF"/>
    <circle cx="64" cy="22" r="9" fill="#0A84FF" fill-opacity="0.18"/>
  </g>

  <!-- Outer subtle 1px hairline -->
  <path d="M64 0.75
           C 22.5 0.75, 0.75 22.5, 0.75 64
           S 22.5 127.25, 64 127.25
           105.5 127.25, 127.25 105.5
           127.25 64, 127.25 22.5
           105.5 0.75, 64 0.75 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
